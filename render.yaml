databases:
  - name: otterspace-daniel-db
    plan: free
    databaseName: otterspace
    user: otterspace
    region: oregon

services:
  - type: web
    name: otterspace-daniel-api
    runtime: python
    plan: free
    region: oregon
    rootDir: lc-career-platform/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: otterspace-daniel-db
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: FRONTEND_URL
        value: https://otterspace-daniel.onrender.com

      - key: PYTHON_VERSION
        value: 3.13.5

  - type: web
    name: otterspace-daniel
    runtime: node
    plan: free
    region: oregon
    rootDir: lc-career-platform/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NEXT_PUBLIC_API_URL
        value: ""

      - key: BACKEND_URL
        value: https://otterspace-daniel-api.onrender.com
